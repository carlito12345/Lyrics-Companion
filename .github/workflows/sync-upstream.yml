name: Legacy fork review (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare retained fork with official upstream
        shell: bash
        run: |
          git remote add upstream https://github.com/zuo-qirun/Lyrics-Companion.git
          git fetch --no-tags upstream main
          {
            echo '## Retained legacy fork'
            echo 'This repository is retained for historical reference and recovery.'
            echo 'GEELY-DESKTOP reads the official upstream through its own pinned submodule.'
            echo 'This manual check does not merge, push, build, or publish an APK.'
            echo "Retained fork: $(git rev-parse HEAD)"
            echo "Official upstream: $(git rev-parse upstream/main)"
            echo 'Commit counts below: fork-only, upstream-only.'
            git rev-list --left-right --count HEAD...upstream/main
            echo 'Review: https://github.com/zuo-qirun/Lyrics-Companion/compare/main...carlito12345:main'
          } >> "$GITHUB_STEP_SUMMARY"
